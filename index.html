<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0757b8"><meta name="description" content="Aplicativo da Igreja Assembléia Comunidade Pentecostal">
<link rel="manifest" href="manifest.json"><link rel="icon" href="logo.png">
<title>Igreja Assembléia Comunidade Pentecostal</title>
<style>
:root{--blue:#0757b8;--blue2:#0b6fe8;--gold:#e9a900;--bg:#f5f8fc;--text:#12304d;--muted:#6b7f94;--card:#fff;--line:#dce7f3}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);box-shadow:0 0 30px #0001}.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(155deg,#fff 0 48%,#eaf3ff 48% 65%,var(--blue) 65%)}.splash img{width:260px;max-width:85%;background:#fff;border-radius:18px}.splash h1{text-align:center;font-size:21px;line-height:1.2;margin:18px 0;color:#064da5}.primary{border:0;border-radius:28px;padding:14px 38px;background:var(--blue);color:#fff;font-weight:700;box-shadow:0 5px 15px #0757b844}.hidden{display:none!important}.top{background:var(--blue);color:#fff;padding:13px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}.top h2{font-size:18px;margin:0;flex:1}.back{border:0;background:transparent;color:#fff;font-size:24px}.home-brand{padding:10px 16px;background:var(--blue);display:flex;align-items:center;gap:10px;color:#fff}.home-brand img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:10px}.home-brand b{font-size:14px}.hero{height:125px;background:linear-gradient(#0005,#0005),url('logo.png') center/cover;display:flex;align-items:end;padding:16px;color:#fff;font-weight:700}.grid{padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:92px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--blue);font-weight:700;font-size:12px;text-align:center;box-shadow:0 3px 9px #0a4a8510}.ico{font-size:25px}.section{padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;box-shadow:0 3px 10px #0a4a8510}.date{color:var(--blue);font-weight:800}.listrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}.pill{display:inline-block;padding:6px 9px;border-radius:9px;background:#eaf3ff;color:var(--blue);font-size:12px;font-weight:700}.field{width:100%;padding:12px;border:1px solid #cbd8e5;border-radius:10px;margin:6px 0 10px;background:#fff}.send{width:100%;border:0;border-radius:12px;padding:13px;background:var(--blue);color:#fff;font-weight:700}.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px}.bottom button{border:0;background:none;color:var(--blue);font-weight:700;font-size:11px}.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.photo-grid img{width:100%;height:125px;object-fit:cover;border-radius:10px}.mapbox{height:220px;border-radius:14px;background:linear-gradient(135deg,#e9f0e7,#d9e5f3);position:relative;overflow:hidden}.mapbox:after{content:'📍';font-size:44px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}a.btn{display:block;text-align:center;text-decoration:none}.muted{color:var(--muted);font-size:13px}.notice{border-left:4px solid var(--gold)}
</style></head>
<body><div class="app">
<div id="splash" class="splash"><img src="logo.png" alt="Logo da igreja"><h1>Igreja Assembléia<br>Comunidade Pentecostal</h1><button class="primary" onclick="startApp()">ENTRAR</button></div>
<div id="app" class="hidden"></div></div>
<script>
const menu=[['📖','Palavra do Dia','word'],['📅','Agenda de Cultos','agenda'],['📋','Escalas do Dia','scales'],['🙏','Pedidos de Oração','prayer'],['📢','Avisos','notices'],['▶️','Cultos ao Vivo','live'],['📸','Galeria','gallery'],['🎶','Louvores','songs'],['📍','Localização','location'],['📞','Contato','contact']];
const events=[['28/09/2026','Culto da Família','19:00'],['30/09/2026','Culto de Oração','19:30'],['03/10/2026','Culto de Doutrina','19:30'],['05/10/2026','Santa Ceia','19:00']];
const scales=[['Dirigente','A definir'],['Louvor','A definir'],['Palavra','A definir'],['Oração','A definir']];
function startApp(){localStorage.setItem('entered','1');renderHome()}
function shell(title,body){return `<div class="top"><button class="back" onclick="renderHome()">‹</button><h2>${title}</h2></div>${body}<div class="bottom"><button onclick="renderHome()">🏠<br>Início</button><button onclick="showMenu()">☰<br>Menu</button></div><div class="section"><button class="send" style="background:#fff;color:var(--blue);border:1px solid var(--line)" onclick="adminLogin()">⚙️ Área Administrativa</button></div>`}
function renderHome(){document.getElementById('splash').classList.add('hidden');const a=document.getElementById('app');a.classList.remove('hidden');a.innerHTML=`<div class="home-brand"><img src="logo.png"><b>Igreja Assembléia Comunidade Pentecostal</b></div><div class="hero">Bem-vindo!</div><div class="grid">${menu.map(x=>`<button class="tile" onclick="openPage('${x[2]}')"><span class="ico">${x[0]}</span>${x[1]}</button>`).join('')}</div><div class="section"><button class="send" style="background:#fff;color:var(--blue);border:1px solid var(--line)" onclick="adminLogin()">⚙️ Área Administrativa</button></div>`}
function showMenu(){renderHome()}
function openPage(p){const pages={word:pageWord,agenda:pageAgenda,scales:pageScales,prayer:pagePrayer,notices:pageNotices,live:pageLive,gallery:pageGallery,songs:pageSongs,location:pageLocation,contact:pageContact};document.getElementById('app').innerHTML=pages[p]()}
const DEFAULTS={
 word:{text:'“Entrega o teu caminho ao Senhor, confia nele, e o mais ele fará.”',ref:'Salmos 37:5'},
 events:[['28/09/2026','Culto da Família','19:00'],['30/09/2026','Culto de Oração','19:30'],['03/10/2026','Culto de Doutrina','19:30'],['05/10/2026','Santa Ceia','19:00']],
 scales:[['Dirigente','A definir'],['Louvor','A definir'],['Palavra','A definir'],['Oração','A definir']],
 notice:'Os avisos da igreja aparecerão aqui.', live:'', contact:{phone:'',whatsapp:'',email:''}
};
function data(k){const v=localStorage.getItem('church_'+k);return v?JSON.parse(v):DEFAULTS[k]}
function saveData(k,v){localStorage.setItem('church_'+k,JSON.stringify(v))}
function adminLogin(){const pass=prompt('Senha do administrador:');if(pass==='1234')openAdmin();else if(pass!==null)alert('Senha incorreta. (Na versão inicial, a senha é 1234.)')}
function openAdmin(){document.getElementById('app').innerHTML=shell('Painel Administrativo',`<div class="section">
<div class="card"><h3>📖 Palavra do Dia</h3><input id="awText" class="field" value="${esc(data('word').text)}"><input id="awRef" class="field" value="${esc(data('word').ref)}"><button class="send" onclick="saveWord()">Salvar palavra</button></div>
<div class="card"><h3>📋 Escalas do Dia</h3>${data('scales').map((x,i)=>`<div><input id="sc${i}" class="field" value="${esc(x[1])}" placeholder="${esc(x[0])}"></div>`).join('')}<button class="send" onclick="saveScales()">Salvar escalas</button></div>
<div class="card"><h3>📅 Adicionar culto</h3><input id="evDate" class="field" placeholder="Data (ex.: 12/10/2026)"><input id="evName" class="field" placeholder="Nome do culto"><input id="evTime" class="field" placeholder="Horário"><button class="send" onclick="addEvent()">Adicionar à agenda</button><div style="margin-top:12px">${data('events').map((e,i)=>`<div class="listrow"><span><b>${esc(e[1])}</b><br><span class="muted">${esc(e[0])} • ${esc(e[2])}</span></span><button onclick="removeEvent(${i})" style="margin-left:auto;border:0;background:#fee;color:#b00;border-radius:8px;padding:7px">Excluir</button></div>`).join('')}</div></div>
<div class="card"><h3>📢 Aviso principal</h3><textarea id="anot" class="field" rows="4">${esc(data('notice'))}</textarea><button class="send" onclick="saveNotice()">Salvar aviso</button></div>
<div class="card"><h3>🎥 Culto ao Vivo</h3><input id="alive" class="field" value="${esc(data('live'))}" placeholder="Cole o link do YouTube ou Facebook"><button class="send" onclick="saveLive()">Salvar link</button></div>
<div class="card"><h3>📞 Contato</h3><input id="aphone" class="field" value="${esc(data('contact').phone)}" placeholder="Telefone"><input id="awhats" class="field" value="${esc(data('contact').whatsapp)}" placeholder="WhatsApp"><input id="aemail" class="field" value="${esc(data('contact').email)}" placeholder="E-mail"><button class="send" onclick="saveContact()">Salvar contato</button></div>
<p class="muted">⚠️ Esta primeira versão salva os dados neste dispositivo. Para vários administradores e atualização em todos os celulares, a próxima etapa será conectar um banco de dados/servidor.</p></div>`)}
function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function saveWord(){saveData('word',{text:document.getElementById('awText').value,ref:document.getElementById('awRef').value});alert('Palavra salva!');openAdmin()}
function saveScales(){let a=data('scales');a=a.map((x,i)=>[x[0],document.getElementById('sc'+i).value||'A definir']);saveData('scales',a);alert('Escalas salvas!');openAdmin()}
function addEvent(){const d=document.getElementById('evDate').value,n=document.getElementById('evName').value,t=document.getElementById('evTime').value;if(!d||!n||!t)return alert('Preencha data, nome e horário.');let a=data('events');a.push([d,n,t]);saveData('events',a);openAdmin()}
function removeEvent(i){let a=data('events');a.splice(i,1);saveData('events',a);openAdmin()}
function saveNotice(){saveData('notice',document.getElementById('anot').value);alert('Aviso salvo!');openAdmin()}
function saveLive(){saveData('live',document.getElementById('alive').value);alert('Link salvo!');openAdmin()}
function saveContact(){saveData('contact',{phone:document.getElementById('aphone').value,whatsapp:document.getElementById('awhats').value,email:document.getElementById('aemail').value});alert('Contato salvo!');openAdmin()}
function pageWord(){return shell('Palavra do Dia',`<div class="section"><div class="card"><div class="date">📖 Palavra do Dia</div><p>${esc(data('word').text)}</p><p class="muted">${esc(data('word').ref)}</p><button class="send" onclick="alert('Versículo preparado para compartilhar!')">📤 Compartilhar</button></div></div>`)}
function pageAgenda(){return shell('Agenda de Cultos',`<div class="section">${data('events').map(e=>`<div class="card"><span class="pill">${e[0]}</span><h3>${e[1]}</h3><div class="muted">🕒 ${e[2]} &nbsp; 📍 Igreja</div></div>`).join('')}</div>`)}
function pageScales(){return shell('Escalas do Dia',`<div class="section"><div class="card"><div class="date">📅 Escala do culto</div>${data('scales').map(s=>`<div class="listrow"><b>${s[0]}</b><span style="margin-left:auto">${s[1]}</span></div>`).join('')}</div><p class="muted">A escala pode ser atualizada pelo responsável pelo aplicativo.</p></div>`)}
function pagePrayer(){return shell('Pedidos de Oração',`<div class="section"><div class="card"><h3>🙏 Deixe seu pedido de oração</h3><p class="muted">Escreva seu pedido. Ele será encaminhado à equipe responsável.</p><textarea id="prayerText" class="field" rows="7" placeholder="Escreva aqui seu pedido de oração..."></textarea><button class="send" onclick="sendPrayer()">📨 Enviar</button></div></div>`)}
function sendPrayer(){const t=document.getElementById('prayerText').value.trim();if(!t)return alert('Digite seu pedido de oração.');localStorage.setItem('lastPrayer',t);alert('Seu pedido foi registrado neste dispositivo.');document.getElementById('prayerText').value=''}
function pageNotices(){return shell('Avisos',`<div class="section"><div class="card notice"><b>Cultos e programação</b><p class="muted">${esc(data('notice'))}</p></div><div class="card notice"><b>Santa Ceia</b><p class="muted">Confira a agenda para a próxima celebração.</p></div></div>`)}
function pageLive(){return shell('Cultos ao Vivo',`<div class="section"><div class="card"><span class="pill">AO VIVO</span><div style="height:210px;margin:12px 0;border-radius:12px;background:#073c83 url('logo.png') center/180px no-repeat;display:grid;place-items:center"><span style="font-size:55px;color:#fff">▶</span></div><button class="send" onclick="const u=data('live'); if(u) location.href=u; else alert('Ainda não há transmissão cadastrada.')">▶ Assistir agora</button></div></div>`)}
function pageGallery(){return shell('Galeria',`<div class="section"><div class="photo-grid">${['logo.png','logo.png','logo.png','logo.png'].map((x,i)=>`<img src="${x}" alt="Foto ${i+1}">`).join('')}</div><p class="muted">As fotos dos cultos e eventos poderão ser adicionadas pelo administrador.</p></div>`)}
function pageSongs(){const songs=['Porque Ele Vive','A Ele a Glória','Grandes Coisas','Eu Navegarei','Mais de Ti','Restaura-me'];return shell('Louvores',`<div class="section">${songs.map(s=>`<div class="card listrow">🎵 <b>${s}</b><span style="margin-left:auto">›</span></div>`).join('')}</div>`)}
function pageLocation(){return shell('Localização',`<div class="section"><div class="mapbox"></div><div class="card"><b>📍 Rua Belo Horizonte, nº 165</b><br>Centro, Cambira – PR</div><a class="send btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Rua+Belo+Horizonte%2C+165%2C+Centro%2C+Cambira%2C+PR">🗺️ Abrir no Google Maps</a></div>`)}
function pageContact(){return shell('Contato',`<div class="section"><div class="card listrow">📞 <div><b>Telefone</b><br><span class="muted">${esc(data('contact').phone||'Não cadastrado')}</span></div></div><div class="card listrow">💬 <div><b>WhatsApp</b><br><span class="muted">${esc(data('contact').whatsapp||'Não cadastrado')}</span></div></div><div class="card listrow">✉️ <div><b>E-mail</b><br><span class="muted">${esc(data('contact').email||'Não cadastrado')}</span></div></div></div>`)}
if(localStorage.getItem('entered'))renderHome();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
